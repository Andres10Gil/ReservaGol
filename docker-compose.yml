services:

  # ── Aplicación ASP.NET Core ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservagol_app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=${DB_NAME};User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True;
      - JWT__Key=${JWT_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - reservagol_net

  # ── SQL Server ───────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: reservagol_sqlserver
    environment:
      SA_PASSWORD: "${DB_SA_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sql/init:/docker-entrypoint-initdb.d
      - ./sql/init-db.sh:/init-db.sh
    command: >
      bash -c "
        /opt/mssql/bin/sqlservr &
        bash /init-db.sh &&
        wait
      "
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "${DB_SA_PASSWORD}",
             "-Q", "SELECT 1", "-No", "-C"]
      interval: 10s
      retries: 10
      start_period: 40s
    networks:
      - reservagol_net

  # ── Adminer (interfaz web para SQL Server) ───────────────────
  adminer:
    image: adminer:latest
    container_name: reservagol_adminer
    ports:
      - "8888:8080"
    environment:
      ADMINER_DEFAULT_SERVER: sqlserver
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - sqlserver
    networks:
      - reservagol_net

volumes:
  sqlserver_data:

networks:
  reservagol_net:
    driver: bridge
